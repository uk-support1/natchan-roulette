<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>なっちゃんのあそびルーレット</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ff8fa3">
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<main>
  <h1><span>✨</span>なっちゃんの<br>あそびルーレット<span>✨</span></h1>

  <section class="stage">
    <div class="bubble" id="bubble" aria-live="polite">なっちゃん、なにしてあそぶ〜？</div>
    <img id="chara" class="chara idle" src="buhio/waving.webp" alt="" draggable="false">
  </section>

  <section class="wheel-wrap">
    <div class="pointer" aria-hidden="true"></div>
    <canvas id="wheel" width="720" height="720" aria-label="ルーレット"></canvas>
  </section>

  <button id="spin" class="spin">まわす！</button>
  <div class="result" id="result" aria-live="polite"></div>

  <details class="editor">
    <summary>あそびをかえる</summary>
    <ul id="list"></ul>
    <form id="add">
      <input id="newItem" maxlength="12" placeholder="あたらしいあそび" autocomplete="off">
      <button type="submit">ついか</button>
    </form>
    <button id="reset" class="ghost" type="button">もとにもどす</button>
  </details>
</main>
<script src="app.js"></script>
</body>
</html>
